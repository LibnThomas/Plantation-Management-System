{% extends "base.html" %}{% load core_tags %}
{% block title %}{% t "Change password" %}{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:480px"><div class="card-body">
  <h5><i class="bi bi-key"></i> {% t "Change password" %}</h5>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label small" for="{{ f.id_for_label }}">{{ f.label }}</label>
      <input id="{{ f.id_for_label }}" type="password" name="{{ f.html_name }}" class="form-control" required>
      {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary">{% t "Change password" %}</button>
  </form>
</div></div>
{% endblock %}
