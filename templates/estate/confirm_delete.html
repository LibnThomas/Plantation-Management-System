{% extends "base.html" %}{% load core_tags %}
{% block content %}
<div class="card mx-auto" style="max-width:520px">
  <div class="card-body text-center p-4">
    <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
    <h5 class="mt-2">{% t "Delete this record?" %}</h5>
    <p class="text-muted mb-1">{{ record_name }}</p>
    <p class="fw-semibold">{{ obj }}</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">{% t "Yes, delete" %}</button>
      <a href="{% url 'estate:list' cfg.slug %}" class="btn btn-outline-secondary">{% t "Cancel" %}</a>
    </form>
  </div>
</div>
{% endblock %}
